<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="横顔撮影">
<title>横顔撮影</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#2a2f3a;--fg:#e8eaf0;--mut:#9aa3b2;--ok:#2ecc71;--ng:#ff5a5f;--acc:#4dabff;--warn:#ffb020;--eye:#ff5c8a;--ear:#4dabff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;font-size:15px;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.screen{display:none;position:fixed;inset:0}
.screen.active{display:flex}
.screen.scroll.active{display:block;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:980px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:18px 0 8px}h3{font-size:14px;margin:10px 0 6px;color:var(--mut)}
button,select,input{font:inherit;color:var(--fg)}
button{background:#283041;border:1px solid #3a4459;border-radius:10px;padding:9px 12px;min-height:42px;cursor:pointer}
button:disabled{opacity:.4}
button.primary{background:var(--acc);border-color:var(--acc);color:#03111f;font-weight:700}
button.on{background:#1d6b42;border-color:#2ecc71}
button.danger{background:#5a1e24;border-color:#a33}
button.sm{min-height:34px;padding:5px 9px;font-size:13px}
select,input[type=text],input[type=number]{background:#10131a;border:1px solid #3a4459;border-radius:8px;padding:8px;min-height:40px}
input[type=number]{width:90px}
label.f{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
label.f>span{min-width:150px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.mut{color:var(--mut)}.small{font-size:12px}
.ok{color:var(--ok)}.ng{color:var(--ng)}.warn{color:var(--warn)}
ul.check{list-style:none;padding:0;margin:0}ul.check li{padding:4px 0}
#libStatus{font-size:13px}
/* shoot */
#shoot{flex-direction:row}
#stage{position:relative;flex:0 0 70%;background:#000;overflow:hidden}
#stage video,#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#stage video{object-fit:contain}
#guide{position:absolute;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));text-align:center;font-size:clamp(18px,3.6vw,32px);font-weight:800;line-height:1.25;text-shadow:0 2px 6px #000,0 0 2px #000;pointer-events:none}
#guide.ok{color:var(--ok)}
#holdbar{position:absolute;left:0;bottom:0;height:8px;width:0;background:var(--ok);transition:width .08s linear}
#warn{position:absolute;left:8px;right:8px;bottom:14px;text-align:center;color:var(--warn);font-weight:700;text-shadow:0 1px 4px #000;pointer-events:none;font-size:14px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#000c;border:1px solid #444;padding:10px 16px;border-radius:10px;z-index:50;display:none;max-width:80vw;text-align:center}
.side{flex:1;min-width:0;overflow:auto;padding:8px max(8px,env(safe-area-inset-right)) 12px 8px;background:var(--panel);border-left:1px solid var(--line)}
table.cond{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0 8px}
table.cond td{padding:3px 3px;border-bottom:1px solid var(--line);vertical-align:top}
table.cond td.v{font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ng)}
.dot.ok{background:var(--ok)}.dot.na{background:#555}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btns .full{grid-column:1/-1}
#sessInfo{font-size:12px;color:var(--mut);margin-bottom:4px}
/* editor */
#edit{flex-direction:row}
#edStage{position:relative;flex:0 0 70%;background:#000;overflow:hidden}
#edCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#loupe{position:absolute;right:10px;top:10px;width:150px;height:150px;border:2px solid #fff;border-radius:8px;background:#000;pointer-events:none}
#edHint{position:absolute;left:8px;bottom:8px;right:170px;font-size:12px;color:#ddd;text-shadow:0 1px 3px #000;pointer-events:none}
#refCv{width:100%;aspect-ratio:4/3;background:#000;border-radius:8px;display:block}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{flex:1}
#rotate{position:fixed;inset:0;background:#000e;z-index:60;display:none;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
@media (orientation:portrait){body.insess #rotate{display:flex}}
</style>
</head>
<body>

<!-- ===== 開始画面 ===== -->
<section id="start" class="screen scroll active">
 <div class="wrap">
  <h1>横顔撮影</h1>
  <div id="libStatus" class="mut">ライブラリを読み込み中…</div>

  <div class="card">
   <label class="f"><span>参加者ID</span><input id="inPid" type="text" placeholder="P01" autocapitalize="characters" autocomplete="off"></label>
   <label class="f"><span>時点</span><select id="inTp"><option>T0</option><option>T1</option><option>T2</option></select></label>
   <label class="f"><span>顔の向き(画面上)</span><select id="inFace"><option value="right">右向き(顔が画面の右を向く)</option><option value="left">左向き(顔が画面の左を向く)</option></select></label>
   <label class="f"><span>三脚の高さのメモ</span><input id="inTripod" type="text" placeholder="例: 脚3段目 + 12 cm"></label>
   <div id="refInfo" class="small mut"></div>
   <div class="row" style="margin-top:10px">
    <button id="btnStart" class="primary">開始(カメラとセンサーを許可)</button>
    <button id="btnSettings">設定</button>
   </div>
   <p class="small mut">スマホを T0 と同じ向きの横向きにしてから「開始」を押してください。T0 では開始時の横向きの左右が基準になります。</p>
  </div>

  <details class="card">
   <summary><b>撮影環境のチェックリスト</b></summary>
   <ul class="check" id="checklist"></ul>
  </details>

  <div class="card">
   <h2 style="margin-top:0">基準データと記録</h2>
   <div class="row">
    <button id="btnExportRef">この参加者の基準データを書き出す</button>
    <label class="row"><button id="btnImportRefBtn">基準データを読み込む</button><input id="fileRef" type="file" accept=".json,application/json" style="display:none"></label>
   </div>
   <div class="row" style="margin-top:8px">
    <button id="btnCsv">記録を CSV で書き出す</button>
    <span id="recCount" class="small mut"></span>
   </div>
   <div id="refList" class="small mut" style="margin-top:8px"></div>
  </div>
  <p class="small mut" id="verInfo"></p>
 </div>
</section>

<!-- ===== 撮影画面 ===== -->
<section id="shoot" class="screen">
 <div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="ov"></canvas>
  <div id="guide"></div>
  <div id="warn"></div>
  <div id="holdbar"></div>
 </div>
 <aside class="side">
  <div id="sessInfo"></div>
  <table class="cond" id="condTable"></table>
  <div class="btns">
   <button id="btnPick" class="full primary">静止画で点を指定</button>
   <button id="btn900" class="full">900 mm を確認した</button>
   <button id="btnArm" class="full">撮影待機を始める</button>
   <button id="btnManual">手動で撮る</button>
   <select id="selOv"><option value="contour">重ね: 輪郭線</option><option value="blend">重ね: 半透明</option><option value="none">重ね: なし</option></select>
   <button id="btnSettings2">設定</button>
   <button id="btnEnd">終了</button>
  </div>
  <div id="dbg" class="small mut" style="margin-top:6px"></div>
 </aside>
</section>

<!-- ===== 点の指定・確認画面(共通エディタ) ===== -->
<section id="edit" class="screen">
 <div id="edStage">
  <canvas id="edCv"></canvas>
  <canvas id="loupe" width="300" height="300"></canvas>
  <div id="edHint"></div>
 </div>
 <aside class="side">
  <h3 id="edTitle" style="margin-top:0;color:var(--fg)">点の指定</h3>
  <div id="edDef" class="small mut"></div>
  <div class="seg" id="edPtSeg" style="margin:8px 0"></div>
  <div class="seg" style="margin:6px 0">
   <button class="sm" data-view="all">全体</button>
   <button class="sm" data-view="active">選択点を拡大</button>
   <button class="sm" id="btnZoom">×4</button>
  </div>
  <div id="edRefBox" style="display:none;margin:8px 0">
   <div class="small mut" id="edRefLabel">T0 の同じ部分</div>
   <canvas id="refCv" width="400" height="300"></canvas>
  </div>
  <div id="edCmpBox" style="display:none;margin:6px 0">
   <select id="selCmp"><option value="none">T0 との比較: なし</option><option value="side">並べる</option><option value="blend">重ねる</option></select>
  </div>
  <div id="edInfo" class="small"></div>
  <table class="cond" id="edCond"></table>
  <div class="btns" id="edBtns"></div>
 </aside>
</section>

<!-- ===== 設定画面 ===== -->
<section id="settings" class="screen scroll">
 <div class="wrap">
  <h1>設定</h1>
  <div class="card" id="setForm"></div>
  <div class="card">
   <h2 style="margin-top:0">校正</h2>
   <div class="row">
    <button id="btnLevelCal">センサーの水平校正(今の状態を 0°)</button>
    <button id="btnLevelReset" class="sm">校正を消す</button>
   </div>
   <p class="small mut" id="levelInfo"></p>
   <div class="row"><button id="btnCamCal">カメラ校正(900 mm の目盛りを撮る)</button></div>
   <p class="small mut" id="camCalInfo"></p>
   <p class="small mut">校正は撮影画面を開いた状態(カメラとセンサーが動いている状態)で行ってください。</p>
  </div>
  <div class="row"><button id="btnSetDefault" class="danger">既定値に戻す</button><button id="btnSetBack" class="primary">戻る</button></div>
 </div>
</section>

<div id="rotate">スマホを横向きにしてください</div>
<div id="toast"></div>

<script>
/*PURE-BEGIN*/
// ============================================================
//  判定ロジック(画面から独立した純粋関数。単体テスト可能)
// ============================================================
var APP_VERSION = '1.0.4';

var DEFAULT_SETTINGS = {
  holdSec: 0.7,
  tolPitch: 1.0, tolRoll: 1.0,
  minInliers: 30, maxTrackErr: 1.5,
  tolHrl: 1.0, tolHeightPct: 1.0,
  refDistMm: 900, tolDistMm: 10,
  tolPosPct: 0.5, minNcc: 0.6,
  tolStillPct: 0.15, tolRotRate: 3.0, tolFrameDiff: 2.5,
  sharpRatio: 0.8, sharpMinT0: 20,
  voice: true, overlay: 'contour', debug: false, semiAuto: false,
  mmPerWidth: 1100,           // 900 mm での画面横幅(mm)。カメラ校正で上書き
  pitchOffset: 0, rollOffset: 0, pitchInvert: false,
  analysisWidth: 960
};

var Judge = {
  deg: function (r) { return r * 180 / Math.PI; },

  // 加速度(重力込み)→ 画面座標の「上」ベクトル。angle は画面の回転角(90 / -90 / 0 / 180)
  // 符号の流儀(端末により逆)は、横向きで端末が立っている前提で自動補正する
  gravityToScreen: function (g, angle) {
    var t = angle * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
    var ux = g.x * c - g.y * s, uy = g.x * s + g.y * c, uz = g.z;
    if (uy < 0) { ux = -ux; uy = -uy; uz = -uz; }
    return { ux: ux, uy: uy, uz: uz };
  },

  // ピッチ: 光軸(背面カメラ = 端末 -z)の仰角。ロール: 画面上の水平のずれ(光軸まわり)
  motionAngles: function (g, angle) {
    var u = Judge.gravityToScreen(g, angle);
    var n = Math.hypot(u.ux, u.uy, u.uz) || 1;
    var p = Math.asin(Math.max(-1, Math.min(1, -u.uz / n)));
    return { pitch: Judge.deg(p), roll: Judge.deg(Math.atan2(u.ux, u.uy)) };
  },

  // HRL: 耳点→目尻点の線が床に対してどれだけ前上がりか(°)。正 = 目尻が高い = あごが上がっている
  hrlRaise: function (eye, ear, W, H, roll) {
    var vx = (eye.x - ear.x) * W, vy = -(eye.y - ear.y) * H;
    var r = (roll || 0) * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
    var wx = vx * c - vy * s, wy = vx * s + vy * c;
    return Judge.deg(Math.atan2(wy, Math.abs(wx)));
  },

  // 目尻–耳の距離(画像の幅で割った値)
  normDist: function (eye, ear, W, H) {
    return Math.hypot(eye.x - ear.x, (eye.y - ear.y) * H / W);
  },

  distEstimate: function (eye, ear, W, H, d0, refMm) {
    var d = Judge.normDist(eye, ear, W, H);
    return d > 0 ? refMm * d0 / d : null;
  },

  // 2点のずれ(画像の幅に対する %)
  posDiffPct: function (p, q, aspect) {
    return Math.hypot(p.x - q.x, (p.y - q.y) * aspect) * 100;
  },

  // 直近 windowMs の点の動きの最大幅(画像の幅に対する %)。履歴が足りなければ null
  stillRangePct: function (hist, now, windowMs, aspect) {
    var h = hist.filter(function (e) { return now - e.t <= windowMs; });
    if (h.length < 3 || now - h[0].t < windowMs * 0.8) return null;
    var m = 0;
    ['eye', 'ear'].forEach(function (k) {
      var xs = h.map(function (e) { return e[k].x; }), ys = h.map(function (e) { return e[k].y; });
      var dx = Math.max.apply(null, xs) - Math.min.apply(null, xs);
      var dy = (Math.max.apply(null, ys) - Math.min.apply(null, ys)) * aspect;
      m = Math.max(m, dx, dy);
    });
    return m * 100;
  },

  // 追跡に使う頭部の枠(目尻と耳を含み、こめかみ・頬まで。前方は顔の輪郭を越えない)
  trackRoi: function (eye, ear, w, h, faceSign) {
    var L = Math.hypot(eye[0] - ear[0], eye[1] - ear[1]);
    var front = eye[0] + faceSign * 0.25 * L, back = ear[0] - faceSign * 0.6 * L;
    var mid = (eye[1] + ear[1]) / 2;
    return Judge.clipRect(Math.min(front, back), mid - 0.8 * L, Math.abs(front - back), 1.7 * L, w, h);
  },

  // 輪郭の一致度に使う枠(横顔の輪郭=鼻・口・あごを含む)
  profileRoi: function (eye, ear, w, h, faceSign) {
    var L = Math.hypot(eye[0] - ear[0], eye[1] - ear[1]);
    var front = eye[0] + faceSign * 1.6 * L, back = ear[0] - faceSign * 0.6 * L;
    var mid = (eye[1] + ear[1]) / 2;
    return Judge.clipRect(Math.min(front, back), mid - 1.2 * L, Math.abs(front - back), 3.4 * L, w, h);
  },

  clipRect: function (x, y, rw, rh, w, h) {
    var x0 = Math.max(0, Math.floor(x)), y0 = Math.max(0, Math.floor(y));
    var x1 = Math.min(w, Math.ceil(x + rw)), y1 = Math.min(h, Math.ceil(y + rh));
    return { x: x0, y: y0, w: Math.max(0, x1 - x0), h: Math.max(0, y1 - y0) };
  },

  toGray: function (rgba, n, out) {
    for (var i = 0, j = 0; j < n; i += 4, j++) out[j] = (rgba[i] * 77 + rgba[i + 1] * 150 + rgba[i + 2] * 29) >> 8;
    return out;
  },

  // 鮮明さ: ラプラシアンの分散
  lapVar: function (g, w, rect) {
    var x0 = Math.max(1, rect.x), y0 = Math.max(1, rect.y);
    var x1 = Math.min(w - 1, rect.x + rect.w), y1 = Math.min(Math.floor(g.length / w) - 1, rect.y + rect.h);
    var s = 0, s2 = 0, n = 0;
    for (var y = y0; y < y1; y++) {
      var o = y * w;
      for (var x = x0; x < x1; x++) {
        var i = o + x;
        var l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - w] - g[i + w];
        s += l; s2 += l * l; n++;
      }
    }
    if (n < 10) return null;
    var m = s / n;
    return s2 / n - m * m;
  },

  // ぼかし(3x3)→ Sobel のエッジ強度
  edgeMap: function (g, w, h) {
    var b = new Float32Array(w * h), e = new Float32Array(w * h), x, y, i;
    for (y = 1; y < h - 1; y++) for (x = 1; x < w - 1; x++) {
      i = y * w + x;
      b[i] = (g[i - w - 1] + 2 * g[i - w] + g[i - w + 1] + 2 * g[i - 1] + 4 * g[i] + 2 * g[i + 1] + g[i + w - 1] + 2 * g[i + w] + g[i + w + 1]) / 16;
    }
    for (y = 2; y < h - 2; y++) for (x = 2; x < w - 2; x++) {
      i = y * w + x;
      var gx = b[i - w + 1] + 2 * b[i + 1] + b[i + w + 1] - b[i - w - 1] - 2 * b[i - 1] - b[i + w - 1];
      var gy = b[i + w - 1] + 2 * b[i + w] + b[i + w + 1] - b[i - w - 1] - 2 * b[i - w] - b[i - w + 1];
      e[i] = Math.sqrt(gx * gx + gy * gy);
    }
    return e;
  },

  // 正規化相互相関
  ncc: function (a, b) {
    var n = Math.min(a.length, b.length), ma = 0, mb = 0, i;
    for (i = 0; i < n; i++) { ma += a[i]; mb += b[i]; }
    ma /= n; mb /= n;
    var sab = 0, saa = 0, sbb = 0;
    for (i = 0; i < n; i++) { var da = a[i] - ma, db = b[i] - mb; sab += da * db; saa += da * da; sbb += db * db; }
    return (saa > 0 && sbb > 0) ? sab / Math.sqrt(saa * sbb) : 0;
  },

  // 相似変換 q = [a -b; b a] p + t
  applySim: function (T, x, y) { return [T.a * x - T.b * y + T.tx, T.b * x + T.a * y + T.ty]; },

  fitSimLS: function (P, Q, idx) {
    var n = idx.length, mpx = 0, mpy = 0, mqx = 0, mqy = 0, k, i;
    for (k = 0; k < n; k++) { i = idx[k]; mpx += P[2 * i]; mpy += P[2 * i + 1]; mqx += Q[2 * i]; mqy += Q[2 * i + 1]; }
    mpx /= n; mpy /= n; mqx /= n; mqy /= n;
    var sa = 0, sb = 0, sp = 0;
    for (k = 0; k < n; k++) {
      i = idx[k];
      var px = P[2 * i] - mpx, py = P[2 * i + 1] - mpy, qx = Q[2 * i] - mqx, qy = Q[2 * i + 1] - mqy;
      sa += px * qx + py * qy; sb += px * qy - py * qx; sp += px * px + py * py;
    }
    if (sp <= 0) return null;
    var a = sa / sp, b = sb / sp;
    return { a: a, b: b, tx: mqx - (a * mpx - b * mpy), ty: mqy - (b * mpx + a * mpy) };
  },

  ransacSim: function (P, Q, n, thr, iters, rnd) {
    rnd = rnd || Math.random;
    if (n < 2) return null;
    var best = null, bestIn = [], t2 = thr * thr, it, k;
    for (it = 0; it < iters; it++) {
      var i = Math.floor(rnd() * n), j = Math.floor(rnd() * n);
      if (i === j) continue;
      var T = Judge.fitSimLS(P, Q, [i, j]);
      if (!T) continue;
      var inl = [];
      for (k = 0; k < n; k++) {
        var m = Judge.applySim(T, P[2 * k], P[2 * k + 1]);
        var dx = m[0] - Q[2 * k], dy = m[1] - Q[2 * k + 1];
        if (dx * dx + dy * dy <= t2) inl.push(k);
      }
      if (inl.length > bestIn.length) { bestIn = inl; best = T; }
    }
    if (!best || bestIn.length < 2) return null;
    for (var rep = 0; rep < 2; rep++) {           // 内点で最小二乗し直す
      var T2 = Judge.fitSimLS(P, Q, bestIn);
      if (!T2) break;
      best = T2;
      var inl2 = [];
      for (k = 0; k < n; k++) {
        var m2 = Judge.applySim(best, P[2 * k], P[2 * k + 1]);
        var ex = m2[0] - Q[2 * k], ey = m2[1] - Q[2 * k + 1];
        if (ex * ex + ey * ey <= t2) inl2.push(k);
      }
      if (inl2.length < 2) break;
      bestIn = inl2;
    }
    var se = 0;
    for (k = 0; k < bestIn.length; k++) {
      var q = Judge.applySim(best, P[2 * bestIn[k]], P[2 * bestIn[k] + 1]);

async function saveCapture() {

  var sess = S.sess, R = cap.eval;
  if (!cap.eye) { alert('目尻と耳を指定してください'); return; }
  var fname = sess.pid + '_' + sess.tp + '_' + stamp(cap.time) + '.jpg';
  var blob = await cap.blobP;
  var file = new File([blob], fname, { type: 'image/jpeg' });
  var shared = false;
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: fname }); shared = true; }
    catch (e) { if (e && e.name === 'AbortError') { toast('保存をキャンセルしました'); return; } }
  }

  var rec = {

    mode: cap.mode === 'auto' ? '自動' : (cap.mode === 'semi' ? '半自動' : '手動'), failed: bad.join(' / '), allOk: R.allOk,
    width: cap.W, height: cap.H, orientAngle: cap.orientAngle, faceDir: sess.faceDir, tripodMemo: sess.tripodMemo,

    pointSource: cap.edited ? '確認画面で修正' : (cap.trackNa ? 'タップ(半自動)' : '追跡'),

    settings: JSON.stringify(S.settings), appVersion: APP_VERSION
  };
  await DB.put('records', rec);
  if (sess.isT0) {
    var make = true;
    if (S.refExists) make = confirm(sess.pid + ' の基準データ(T0)はすでにあります。この写真で作り直しますか?');

      var ref = {

        eye: cap.eye, ear: cap.ear, d0: d0 || null, hrl: v.hrl, pitch: v.pitch, roll: v.roll,
        sharp: cap.sharp, orientAngle: cap.orientAngle, faceDir: sess.faceDir, tripodMemo: sess.tripodMemo,
        filename: fname, appVersion: APP_VERSION

  $('#setForm').querySelector('[data-s=overlay]').onchange = function (e) { s.overlay = e.target.value; saveSettings(); };
  $('#levelInfo').textContent = '現在の補正: ピッチ ' + F(s.pitchOffset, 2) + '°、ロール ' + F(s.rollOffset, 2) + '°' + (S.motion.rawPitch != null ? '(生の値: ピッチ ' + F(S.motion.rawPitch, 2) + '°、ロール ' + F(S.motion.rawRoll, 2) + '°)' : '');
  $('#camCalInfo').textContent = s.camCalAt ? '校正済み: 横幅 ' + F(s.mmPerWidth, 0) + ' mm(' + s.camCalAt + '、' + s.camCalRes + ')' : '未校正(概算 ' + F(s.mmPerWidth, 0) + ' mm を使用)';
}
var settingsFrom = 'start';
function openSettings(from) { settingsFrom = from; S.paused = true; renderSettings(); show('settings'); }
function closeSettings() {
  if (settingsFrom === 'shoot' && S.stream) {
    if (S.settings.semiAuto && S.tracker) { S.tracker.release(); S.tracker = null; S.pts = null; }
    $('#selOv').value = S.settings.overlay; updateSessInfo(); backToShoot();
  } else { show('start'); refreshStart(); }
}

// ---------- チェックリスト ----------
var CHECKS = ['三脚にスマホホルダーで横向きに固定し、脚の位置を床のテープの印に合わせた',
  'レンズから耳の付け根まで 900 mm(床の足の印・メジャーで確認)',
  'レンズの中心を目尻の高さに合わせた(三脚の高さを記録)',
  '白または明るい無地の壁から 50 cm 以上離れて立ち、壁に影が出ていない',
  'いつもと同じ部屋・同じ照明(窓の光を避ける)',
  '正面の壁の目の高さに注視点の印を貼った',
  '被写体: 奥歯を軽く噛む、顔の力を抜く、眼鏡を外す',
  '被写体: 前髪を上げて額を出す、髪を耳にかける、鎖骨まで見える服装'];

// ---------- イベント ----------
function bind() {
  $('#checklist').innerHTML = CHECKS.map(function (c, i) { return '<li><label class="row"><input type="checkbox" id="ck' + i + '"> ' + c + '</label></li>'; }).join('');
  $('#btnStart').onclick = startSession;
  $('#btnSettings').onclick = function () { openSettings('start'); };
  $('#btnSettings2').onclick = function () { openSettings('shoot'); };
  $('#btnSetBack').onclick = closeSettings;
  $('#btnSetDefault').onclick = function () {
    if (!confirm('許容範囲などを既定値に戻します(校正の値は残します)。')) return;
    var keep = { mmPerWidth: S.settings.mmPerWidth, camCalAt: S.settings.camCalAt, camCalRes: S.settings.camCalRes, pitchOffset: S.settings.pitchOffset, rollOffset: S.settings.rollOffset, pitchInvert: S.settings.pitchInvert };
    S.settings = Object.assign({}, DEFAULT_SETTINGS, keep); saveSettings(); renderSettings();
  };
  $('#btnLevelCal').onclick = function () {
    if (S.motion.rawPitch == null) { alert('センサーの値がありません。撮影画面を開いてから行ってください。'); return; }
    if (!confirm('水平器で合わせた状態ですか? 今の値を 0° にします。')) return;
    S.settings.pitchOffset = S.motion.rawPitch; S.settings.rollOffset = S.motion.rawRoll; saveSettings(); renderSettings();
  };
  $('#btnLevelReset').onclick = function () { S.settings.pitchOffset = 0; S.settings.rollOffset = 0; saveSettings(); renderSettings(); };
  $('#btnCamCal').onclick = function () {
    if (!S.stream) { alert('撮影画面を開いてから行ってください。'); return; }
    show('shoot'); setTimeout(function () { openEditor('calib'); }, 150);
  };
  $('#btnPick').onclick = function () { if (!S.W) return; openEditor('points'); };
  $('#btn900').onclick = function () {
    if (S.d0 || S.d0Pending) { if (!confirm('900 mm の基準を取り直しますか?')) return; S.d0 = null; S.d0Pending = false; updateSessInfo(); return; }
    if (S.settings.semiAuto) { S.d0Pending = true; toast('900 mm 確認済み。撮影した写真の目尻–耳の距離を基準にします。'); updateSessInfo(); return; }
    if (!S.pts || !S.lastEval || !S.lastEval.conds[3].ok) { alert('先に点を指定し、追跡が正常な状態で押してください。'); return; }
    S.d0 = Judge.normDist(S.pts.eye, S.pts.ear, S.W, S.H);
    toast('距離の基準 d0 を記録しました(目尻–耳 = 画像の幅の ' + F(S.d0 * 100, 2) + '%)'); updateSessInfo();
  };
  $('#btnArm').onclick = function () { S.armed = !S.armed; S.holdStart = 0; updateArmBtn(); if (S.armed) Voice.say('撮影を始めます。正面の印を見てください', true); };
  $('#btnManual').onclick = function () { capture('manual'); };
  $('#selOv').onchange = function (e) { S.settings.overlay = e.target.value; saveSettings(); };
  $('#btnEnd').onclick = function () { if (confirm('撮影を終了しますか?')) endSession(); };
  document.querySelectorAll('#edit [data-view]').forEach(function (b) { b.onclick = function () { Ed.setView(b.dataset.view === 'all' ? 'all' : 'active'); Ed.drawRef(); }; });
  $('#btnZoom').onclick = function () { var z = [2, 4, 8], i = (z.indexOf(Ed.view.zoom) + 1) % z.length; Ed.view.zoom = z[i]; $('#btnZoom').textContent = '×' + z[i]; if (Ed.view.mode === 'all') Ed.setView('active'); else Ed.draw(); Ed.drawRef(); };
  $('#selCmp').onchange = function () { Ed.draw(); Ed.drawRef(); };
  $('#btnExportRef').onclick = exportRef;
  $('#btnImportRefBtn').onclick = function () { $('#fileRef').click(); };
  $('#fileRef').onchange = function (e) { if (e.target.files[0]) importRef(e.target.files[0]); e.target.value = ''; };
  $('#btnCsv').onclick = exportCsv;
  $('#inPid').addEventListener('input', refreshStart);
  $('#verInfo').textContent = '版 ' + APP_VERSION + ' · 映像と写真は端末内でのみ処理し、外部へ送信しません。';
  Ed.init();
}

bind(); refreshStart(); libStatus();
if (!window.isSecureContext) $('#libStatus').innerHTML = '<span class="ng">https で開いてください(カメラとセンサーは https でしか使えません)</span>';
loadCV(); loadPose();
</script>
</body>
</html>
